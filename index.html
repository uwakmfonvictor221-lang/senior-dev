<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css"
      integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="style.css" />
    <title>Glide</title>
  </head>
  <body>
    <header>
      <div class="logo">
        <link
          href="https://fonts.googleapis.com/css2?family=Playwrite+AR+Guides&family=Rubik+Storm&display=swap"
          rel="stylesheet"
        />
        <p>Glide</p>
      </div>
      <ul>
        <li><a href="#">product</a></li>
        <li><a href="#">enterprise</a></li>
        <li><a href="#">customers</a></li>
        <li><a href="#">resources</a></li>
        <li><a href="#">pricing</a></li>
      </ul>
      <div class="btl-container">
        <button class="pot">
          <i class="fa-solid fa-magnifying-glass"></i>
        </button>
        <button class="pot">login</button
        ><button class="pot">contact sales</button
        ><button class="plate">start for free</button>
      </div>
    </header>
    <main>
      <section class="hero">
        <div id="left">
          <div class="mr flex">
            <p class="dave">Inventory Management Software</p>
            <h1>Build custom inventory management software with AI</h1>
            <p class="phonk">
              Stay ahead of demand, prevent stockouts, and streamline
              fulfillment with ai-powered software tailored to how you move
              inventory.
            </p>
            <div class="sportify"> 
            <textarea placeholder="describe what you want to do...."></textarea>
              <div class="dad">
                <button class="pot"><i class="fa-solid fa-paperclip"></i>upload spreadsheet</button>
              <button class="plate">Build app</button>
              </div>
            </div>
          </div>
        </div>

        <div id="right">
          <img src="senior mahn.jpeg" alt="" />
        </div>
      </section>
    </main>
  </body>
</html>
